<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca - Administração</title>
</head>
<body>
    <h1>Cadastro de Livros</h1>
    <form action="/add" method="post">
        <input type="text" name="title" placeholder="Título do livro" required><br><br>
        <input type="text" name="author" placeholder="Autor" required><br><br>
        <input type="url" name="link" placeholder="Link para PDF ou conteúdo" required><br><br>
        <button type="submit">Gerar QR Code</button>
    </form>

    <hr>
    <h2>Livros Cadastrados</h2>
    <ul>
        {% for book in books %}
        <li>
            <strong>{{ book.title }}</strong> - {{ book.author }}<br>
            <img src="{{ url_for('static', filename=book.qr.split('/')[-1]) }}" width="100"><br>
            <a href="/book/{{ book.id }}">Ver página do livro</a>
        </li>
        <br>
        {% endfor %}
    </ul>
</body>
</html>
